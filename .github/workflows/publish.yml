name: Publish to npm

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check if already on npm
        id: check_npm
        run: |
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if npm view "bitwrench@$PKG_VERSION" version 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and GitHub Release
        if: steps.check_npm.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          if ! git ls-remote --tags origin "$VERSION" | grep -q .; then
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
          # An unmatched glob is passed through literally in bash, and
          # gh would then fail on a nonexistent filename. nullglob drops
          # empty patterns instead, so the release degrades rather than
          # breaking if a build stops emitting one of these families.
          shopt -s nullglob
          if ! gh release view "$VERSION" > /dev/null 2>&1; then
            # Prefer the curated CHANGELOG section for this version; fall back
            # to generated commit-subject notes if the section is absent.
            NOTES_ARG="--generate-notes"
            if awk -v v="## ${VERSION} " 'index($0,v)==1{f=1;next} f&&/^## v/{exit} f' \
                 CHANGELOG.md > /tmp/release-notes.md && [ -s /tmp/release-notes.md ]; then
              NOTES_ARG="--notes-file=/tmp/release-notes.md"
            fi
            # Asset globs must cover .cjs: CommonJS builds use a bare .cjs
            # extension (package.json sets "type": "module"), so a *.js glob
            # silently omits every CommonJS bundle. The .gz companions matter
            # for embedded targets that serve pre-compressed files from flash.
            gh release create "$VERSION" \
              --title "bitwrench $VERSION" \
              "$NOTES_ARG" \
              dist/*.js dist/*.js.map dist/*.css \
              dist/*.cjs dist/*.cjs.map dist/*.gz dist/*.d.ts
          fi

      - name: Publish to npm
        if: steps.check_npm.outputs.published == 'false'
        run: npx -y npm@latest publish --provenance --access public
