version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 1
    groups:
      all-dev-deps:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    ignore:
      # jsdom: v27+ is ESM-only, breaks jsdom-global/register (CJS)
      - dependency-name: "jsdom"
        versions: [">=27.0.0"]
      # @babel/*: v8 is blocked by @rollup/plugin-babel, whose latest (7.1.0)
      # still peer-requires @babel/core ^7.0.0. Revisit when plugin-babel
      # ships Babel 8 support.
      - dependency-name: "@babel/core"
        versions: [">=8.0.0"]
      - dependency-name: "@babel/preset-env"
        versions: [">=8.0.0"]
      - dependency-name: "@babel/preset-react"
        versions: [">=8.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 1
    groups:
      all-ci-actions:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
