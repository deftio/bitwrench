<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board Dashboard</title>
  <script src="/bitwrench.umd.min.js"></script>
</head>
<body>
  <div id="app"></div>

  <script>
    // =====================================================================
    // Embedded Basic Dashboard
    //
    // Shared HTML for ESP32-S3 Pro and Pico 2W basic examples.
    // Served from device flash (LittleFS). Connects to /events for SSE
    // and sends commands via POST /api/command.
    //
    // Features: NeoPixel / LED control, on-chip temp, battery/USB voltage,
    // WiFi RSSI, heap usage, uptime, board info.
    // =====================================================================

    bw.loadStyles({
      primary: '#10b981',
      secondary: '#6366f1',
      spacing: 'compact',
      radius: 'sm'
    });

    bw.injectCSS(bw.css({
      'body': {
        background: '#0f172a',
        color: '#e2e8f0',
        margin: '0',
        'min-height': '100vh'
      },
      '.dash-header': {
        'text-align': 'center',
        padding: '1.5rem 1rem 0.5rem',
        'border-bottom': '1px solid #1e293b'
      },
      '.dash-header h1': {
        margin: '0 0 0.25rem',
        'font-size': '1.25rem',
        color: '#10b981'
      },
      '.dash-header .subtitle': {
        'font-size': '0.8rem',
        color: '#64748b'
      },
      '.dash-status': {
        display: 'inline-block',
        width: '8px',
        height: '8px',
        'border-radius': '50%',
        'margin-right': '0.4rem',
        'vertical-align': 'middle'
      },
      '.dash-status.online': { background: '#10b981' },
      '.dash-status.offline': { background: '#ef4444' },
      '.color-btn': {
        width: '36px',
        height: '36px',
        'border-radius': '50%',
        border: '2px solid transparent',
        cursor: 'pointer',
        margin: '0.2rem',
        transition: 'border-color 0.15s'
      },
      '.color-btn:hover': {
        'border-color': '#e2e8f0'
      },
      '.color-btn.active': {
        'border-color': '#fff',
        'box-shadow': '0 0 8px rgba(255,255,255,0.3)'
      }
    }));

    // -- State ----------------------------------------------------------------
    var state = {
      connected: false,
      board: '--',
      chip: '--',
      flash: '--',
      mac: '--',
      firmware: '--',
      temp: '--',
      voltage: '--',
      rssi: '--',
      heap: '--',
      psram: '--',
      uptime: '--',
      ledColor: '#000000',
      hasNeopixel: false
    };

    var neopixelColors = [
      { name: 'Red',    hex: '#ff0000' },
      { name: 'Green',  hex: '#00ff00' },
      { name: 'Blue',   hex: '#0000ff' },
      { name: 'Cyan',   hex: '#00ffff' },
      { name: 'Purple', hex: '#8b00ff' },
      { name: 'Warm',   hex: '#ff8c00' },
      { name: 'White',  hex: '#ffffff' },
      { name: 'Off',    hex: '#000000' }
    ];

    var logEntries = [];

    function addLog(msg) {
      var ts = new Date().toLocaleTimeString();
      logEntries.unshift(ts + ' -- ' + msg);
      if (logEntries.length > 15) logEntries.pop();
    }

    // -- API ------------------------------------------------------------------

    function sendCmd(cmd, data) {
      fetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ cmd: cmd }, data || {}))
      });
    }

    function setColor(hex) {
      state.ledColor = hex;
      sendCmd('set_color', { color: hex });
      render();
    }

    function toggleLed() {
      sendCmd('toggle_led');
    }

    // -- SSE ------------------------------------------------------------------

    function connectSSE() {
      var es = new EventSource('/events');

      es.onmessage = function(e) {
        var raw = e.data;
        if (raw.charAt(0) === 'r') raw = raw.slice(1).replace(/'/g, '"');
        try { var msg = JSON.parse(raw); } catch(x) { return; }

        if (msg.type === 'batch') {
          msg.ops.forEach(applyOp);
        } else {
          applyOp(msg);
        }
      };

      es.onopen = function() {
        if (!state.connected) {
          state.connected = true;
          addLog('Connected to device');
          render();
        }
      };

      es.onerror = function() {
        if (state.connected) {
          state.connected = false;
          addLog('Connection lost -- reconnecting...');
          render();
        }
      };
    }

    function applyOp(op) {
      if (op.type === 'patch' && op.ref && op.text != null) {
        // Update state from known refs
        var map = {
          'val-temp': 'temp',
          'val-voltage': 'voltage',
          'val-rssi': 'rssi',
          'val-heap': 'heap',
          'val-psram': 'psram',
          'val-uptime': 'uptime',
          'val-board': 'board',
          'val-chip': 'chip',
          'val-flash': 'flash',
          'val-mac': 'mac',
          'val-firmware': 'firmware',
          'val-neopixel': 'hasNeopixel'
        };
        if (map[op.ref]) {
          state[map[op.ref]] = op.text;
          if (op.ref === 'val-neopixel') {
            state.hasNeopixel = op.text === '1' || op.text === 'true';
          }
        }
        // Also update DOM directly for live values
        bw.el(op.ref, function(el) { el.textContent = op.text; });

        // Track connection
        if (!state.connected) {
          state.connected = true;
          addLog('Connected to device');
          render();
        }
      }
    }

    // -- Render ---------------------------------------------------------------

    function makeStatCard(label, id, icon) {
      return bw.makeCol({ size: { xs: 6, md: 4, lg: 3 }, content:
        bw.makeCard({
          className: 'bw_mb_2',
          content: [
            { t: 'div', a: { style: 'font-size:0.75rem;color:#94a3b8;text-transform:uppercase;margin-bottom:0.3rem' }, c: label },
            { t: 'div', a: { id: id, style: 'font-size:1.3rem;font-weight:700;color:#38bdf8' }, c: state[{
              'val-temp': 'temp', 'val-voltage': 'voltage', 'val-rssi': 'rssi',
              'val-heap': 'heap', 'val-psram': 'psram', 'val-uptime': 'uptime'
            }[id]] || '--' }
          ]
        })
      });
    }

    function render() {
      var statusDot = { t: 'span', a: { class: 'dash-status ' + (state.connected ? 'online' : 'offline') }, c: '' };

      // NeoPixel / LED section
      var ledContent;
      if (state.hasNeopixel) {
        var colorBtns = neopixelColors.map(function(c) {
          return {
            t: 'button', a: {
              class: 'color-btn' + (state.ledColor === c.hex ? ' active' : ''),
              style: 'background:' + c.hex + (c.hex === '#000000' ? ';border:1px solid #475569' : ''),
              title: c.name,
              onclick: 'setColor(\'' + c.hex + '\')'
            }, c: ''
          };
        });
        ledContent = bw.makeCard({
          title: 'NeoPixel',
          className: 'bw_mb_3',
          content: [
            { t: 'div', a: { style: 'display:flex;flex-wrap:wrap;gap:0.25rem;justify-content:center' }, c: colorBtns }
          ]
        });
      } else {
        ledContent = bw.makeCard({
          title: 'Onboard LED',
          className: 'bw_mb_3',
          content: [
            bw.makeButton({ text: 'Toggle LED', variant: 'outline_success', size: 'sm', onclick: toggleLed })
          ]
        });
      }

      // System stats
      var statsRow = bw.makeRow({
        children: [
          makeStatCard('Temperature', 'val-temp'),
          makeStatCard('Voltage', 'val-voltage'),
          makeStatCard('WiFi RSSI', 'val-rssi'),
          makeStatCard('Free Heap', 'val-heap'),
          makeStatCard('PSRAM', 'val-psram'),
          makeStatCard('Uptime', 'val-uptime')
        ]
      });

      // Board info
      var infoTable = bw.makeTable({
        data: [
          { Property: 'Board',    Value: state.board },
          { Property: 'Chip',     Value: state.chip },
          { Property: 'Flash',    Value: state.flash },
          { Property: 'MAC',      Value: state.mac },
          { Property: 'Firmware', Value: state.firmware }
        ],
        columns: [
          { key: 'Property', label: 'Property' },
          { key: 'Value', label: 'Value' }
        ],
        striped: true,
        hover: true
      });

      // Log
      var logList = bw.makeListGroup({
        items: logEntries.length ? logEntries : ['Waiting for connection...']
      });

      // Assemble page
      bw.DOM('#app', bw.makeContainer({
        className: 'bw_py_2',
        children: [
          // Header
          { t: 'div', a: { class: 'dash-header' }, c: [
            { t: 'h1', c: [statusDot, ' Board Dashboard'] },
            { t: 'div', a: { class: 'subtitle' }, c: state.board + ' | ' + state.chip }
          ]},

          // Alert if disconnected
          state.connected ? null : bw.makeAlert({
            content: 'Connecting to device...',
            variant: 'warning',
            className: 'bw_mt_3'
          }),

          // LED section
          { t: 'div', a: { class: 'bw_mt_3' }, c: ledContent },

          // System stats
          bw.makeSection({ title: 'System', content: [statsRow] }),

          // Board info
          bw.makeSection({ title: 'Board Info', content: [infoTable] }),

          // Event log
          bw.makeSection({ title: 'Event Log', content: [logList] })
        ].filter(Boolean)
      }));
    }

    // -- Start ----------------------------------------------------------------
    addLog('Connecting to device...');
    render();
    connectSSE();
  </script>
</body>
</html>
