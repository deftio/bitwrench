<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitwrench - Quick Start</title>
  <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
  <script src="../dist/bitwrench.umd.min.js"></script>
  <script src="shared-nav.js"></script>
  <script src="site.js"></script>
  <script src="../dist/bitwrench-code-edit.umd.min.js"></script>
  <script src="shared-tryit.js"></script>
</head>
<body>
  <div id="example-nav"></div>
  <div id="app"></div>

  <script>
    var styles = initBitwrenchPage('00-quick-start.html');
    var p = styles.palette;

    // =========================================================================
    // Section 1: Your First Bitwrench Page
    // =========================================================================
    var helloCode = '<!DOCTYPE html>\n<html>\n<head>\n  <script src="https://cdn.jsdelivr.net/npm/bitwrench@2/dist/bitwrench.umd.min.js"><\/script>\n</head>\n<body>\n  <div id="app"></div>\n  <script>\n    bw.loadStyles();\n    bw.mount(\'#app\', { t: \'h1\', c: \'Hello bitwrench!\' });\n  <\/script>\n</body>\n</html>';

    var section1 = {
      t: 'div', a: { class: 'bw_site_pages_demo', id: 'section-first-page' },
      c: [
        { t: 'h2', a: { class: 'bw_site_pages_demo_title' }, c: { t: 'a', a: { href: '#section-first-page' }, c: 'Your First Bitwrench Page' } },
        { t: 'div', a: { class: 'bw_site_pages_demo_body' }, c: [
          { t: 'p', a: { class: 'bw_site_pages_demo_desc' },
            c: 'This is the complete code for a bitwrench page. Edit the code and click Run to see the result:' },
          makeTryIt({ code: helloCode, lang: 'html', label: 'HTML', height: '280px' }),
          site.makeCallout('concept', 'What just happened?', {
            t: 'p', c: [
              { t: 'code', c: 'bw.mount(\'#app\', taco)' },
              ' mounts a TACO object into any CSS selector (',
              { t: 'code', c: 'bw.DOM()' },
              ' is another name for it). The TACO ',
              { t: 'code', c: '{ t: \'h1\', c: \'Hello bitwrench!\' }' },
              ' becomes an ',
              { t: 'code', c: '<h1>' },
              ' element. Try changing the text, tag, or adding attributes like ',
              { t: 'code', c: "a: { style: 'color: teal;' }" },
              '.'
            ]
          }),
          site.makeCallout('tip', 'Which file should I load?', {
            t: 'p', c: [
              { t: 'code', c: 'bitwrench.umd.min.js' }, ' has everything (~45 KB gzipped). ',
              { t: 'code', c: 'bitwrench-lean.umd.min.js' }, ' (~35 KB) drops the built-in components if you bring your own design. ',
              { t: 'code', c: 'bitwrench.umd.js' }, ' is unminified, for readable stack traces while debugging -- don\'t ship it. ',
              'Every file is listed on the ', { t: 'a', a: { href: '09-downloads.html' }, c: 'Downloads' }, ' page.'
            ]
          })
        ]}
      ]
    };

    // =========================================================================
    // Section 2: Building Blocks
    // =========================================================================
    var section2 = {
      t: 'div', a: { class: 'bw_site_pages_demo', id: 'section-building-blocks' },
      c: [
        { t: 'h2', a: { class: 'bw_site_pages_demo_title' }, c: { t: 'a', a: { href: '#section-building-blocks' }, c: 'Building Blocks' } },
        { t: 'div', a: { class: 'bw_site_pages_demo_body' }, c: [
          { t: 'p', a: { class: 'bw_site_pages_demo_desc' },
            c: 'Every HTML element is a JavaScript object with a tag, attributes, and content. Build up progressively:' },
          makeTryIt({
            code: [
              '// Start simple: just a tag and content',
              'bw.DOM(target, {',
              '  t: \'div\',',
              '  c: [',
              '    // Plain text',
              '    { t: \'p\', c: \'Just text.\' },',
              '',
              '    // Add attributes: style, class, etc.',
              '    { t: \'p\', a: { style: \'color: teal; font-weight: bold;\' }, c: \'Styled!\' },',
              '',
              '    // Nest elements inside each other',
              '    { t: \'div\', a: { style: \'border: 1px solid #ccc; padding: 0.75rem; border-radius: 6px;\' },',
              '      c: [',
              '        { t: \'h3\', a: { style: \'margin: 0 0 0.5rem;\' }, c: \'Nested Card\' },',
              '        { t: \'p\', a: { style: \'margin: 0;\' }, c: \'Content inside a nested div.\' }',
              '      ]',
              '    }',
              '  ]',
              '});'
            ].join('\n'),
            height: '320px'
          }),
          site.makeCallout('concept', 'This is called TACO', {
            t: 'p', c: [
              { t: 'strong', c: 'T' }, 'ag, ',
              { t: 'strong', c: 'A' }, 'ttributes, ',
              { t: 'strong', c: 'C' }, 'ontent, ',
              { t: 'strong', c: 'O' }, 'ptions. ',
              'You\'ve just used it. The name comes after you\'ve seen the idea \u2014 it\'s just ',
              'a plain JavaScript object that maps directly to HTML. Only ',
              { t: 'code', c: 't' }, ' is required; everything else is optional.'
            ]
          }),
          site.makeCallout('tip', 'Prefer positional arguments? Use bw.h()', {
            t: 'p', c: [
              { t: 'code', c: "bw.h('p', { class: 'intro' }, 'Hello')" },
              ' returns exactly ',
              { t: 'code', c: "{ t: 'p', a: { class: 'intro' }, c: 'Hello' }" },
              '. Alias it (', { t: 'code', c: 'var h = bw.h;' },
              ') and mix it freely with literal objects and ', { t: 'code', c: 'make*()' }, ' results.'
            ]
          })
        ]}
      ]
    };

    // =========================================================================
    // Section 2b: SVG is TACO too
    // =========================================================================
    var section2b = {
      t: 'div', a: { class: 'bw_site_pages_demo', id: 'section-svg' },
      c: [
        { t: 'h2', a: { class: 'bw_site_pages_demo_title' }, c: { t: 'a', a: { href: '#section-svg' }, c: 'SVG Is TACO Too' } },
        { t: 'div', a: { class: 'bw_site_pages_demo_body' }, c: [
          { t: 'p', a: { class: 'bw_site_pages_demo_desc' }, c: [
            'Start a tree with ', { t: 'code', c: "t: 'svg'" },
            ' and everything inside is real SVG. Attribute names stay as SVG spells them, and handlers work like anywhere else:'
          ]},
          makeTryIt({
            code: [
              'var notes = [\'C\', \'D\', \'E\', \'F\', \'G\', \'A\', \'B\'];',
              '',
              'bw.DOM(target, {',
              '  t: \'svg\', a: { viewBox: \'0 0 140 60\', width: 280 },',
              '  c: notes.map(function(n, i) {',
              '    return { t: \'g\', c: [',
              '      { t: \'rect\', a: { x: i * 20, y: 0, width: 19, height: 60,',
              '          fill: \'#fff\', stroke: \'#333\', \'stroke-width\': 1,',
              '          onclick: function() { bw.patch(\'picked\', \'You pressed \' + n); } } },',
              '      { t: \'text\', a: { x: i * 20 + 10, y: 52, \'text-anchor\': \'middle\',',
              '          \'font-size\': 9, \'pointer-events\': \'none\' }, c: n }',
              '    ]};',
              '  })',
              '});',
              'bw.append(target, { t: \'p\', a: { id: \'picked\' }, c: \'Click a key.\' });'
            ].join('\n'),
            height: '320px'
          }),
          site.makeCallout('concept', 'Build SVG as objects, not strings', {
            t: 'p', c: [
              'An SVG string passed through ', { t: 'code', c: 'bw.raw()' },
              ' can\'t carry handlers or state and can\'t be patched later. As TACO, every shape is a normal element: ',
              { t: 'code', c: 'class' }, ', ', { t: 'code', c: 'onclick' }, ', ', { t: 'code', c: 'o.state' },
              ' and ', { t: 'code', c: 'bw.patch()' }, ' all work.'
            ]
          })
        ]}
      ]
    };

    // =========================================================================
    // Section 3: Where Do Styles Come From?
    // =========================================================================
    var btnTaco = bw.makeButton({ text: 'Click Me', variant: 'primary' });

    var section3 = {
      t: 'div', a: { class: 'bw_site_pages_demo', id: 'section-styles' },
      c: [
        { t: 'h2', a: { class: 'bw_site_pages_demo_title' }, c: { t: 'a', a: { href: '#section-styles' }, c: 'Where Do Styles Come From?' } },
        { t: 'div', a: { class: 'bw_site_pages_demo_body' }, c: [
          { t: 'p', a: { class: 'bw_site_pages_demo_desc' }, c: [
            'Bitwrench includes built-in CSS classes (',
            { t: 'code', c: 'bw_bccl_btn' }, ', ', { t: 'code', c: 'bw_bccl_card' },
            ', etc.) that give you Bootstrap-like styling. Call ',
            { t: 'code', c: 'bw.loadStyles()' }, ' once to load the structural CSS.'
          ]},
          makeTryIt({
            code: [
              '// bitwrench includes Bootstrap-like CSS classes',
              'bw.DOM(target, {',
              '  t: \'div\', c: [',
              '    bw.makeButton({ text: \'Primary\', variant: \'primary\' }),',
              '    \' \',',
              '    bw.makeButton({ text: \'Success\', variant: \'success\' }),',
              '    \' \',',
              '    bw.makeButton({ text: \'Danger\', variant: \'danger\' }),',
              '    { t: \'div\', a: { style: \'margin-top: 1rem;\' },',
              '      c: bw.makeAlert({ content: \'This is a bitwrench alert.\', variant: \'info\' })',
              '    },',
              '    bw.makeCard({ title: \'Card\', content: \'Built-in card component.\' })',
              '  ]',
              '});'
            ].join('\n'),
            height: '240px'
          }),
          showPipeline({
            label: 'What does bw.makeButton() actually return?',
            helperCode: 'bw.makeButton({\n  text: \'Click Me\',\n  variant: \'primary\'\n})',
            taco: btnTaco
          }),
          site.makeCallout('concept', 'Helpers return JavaScript objects, not HTML', {
            t: 'p', c: [
              { t: 'code', c: 'bw.makeButton()' }, ' returns a TACO object. ',
              { t: 'code', c: 'bw.DOM()' }, ' renders it. ',
              'The helper is just a shortcut for writing the object yourself. See the ',
              { t: 'a', a: { href: '03-styling.html' }, c: 'Styling' },
              ' page for the full CSS story.'
            ]
          })
        ]}
      ]
    };

    // =========================================================================
    // Section 4: Making It Interactive
    // =========================================================================
    var section4 = {
      t: 'div', a: { class: 'bw_site_pages_demo', id: 'section-interactive' },
      c: [
        { t: 'h2', a: { class: 'bw_site_pages_demo_title' }, c: { t: 'a', a: { href: '#section-interactive' }, c: 'Making It Interactive' } },
        { t: 'div', a: { class: 'bw_site_pages_demo_body' }, c: [
          { t: 'p', a: { class: 'bw_site_pages_demo_desc' },
            c: 'The simplest update: when state changes, call your render function again, and bitwrench replaces the old content with the new. Every update is a call you make -- nothing re-renders behind your back.' },
          makeTryIt({
            code: [
              'var count = 0;',
              '',
              'function render() {',
              '  bw.DOM(target, {',
              '    t: \'div\', c: [',
              '      { t: \'h3\', c: \'Count: \' + count },',
              '      bw.makeButton({',
              '        text: \'+\', variant: \'primary\',',
              '        onclick: function() { count++; render(); }',
              '      }),',
              '      \' \',',
              '      bw.makeButton({',
              '        text: \'\\u2013\', variant: \'secondary\',',
              '        onclick: function() { count--; render(); }',
              '      }),',
              '      \' \',',
              '      bw.makeButton({',
              '        text: \'Reset\', variant: \'secondary\',',
              '        onclick: function() { count = 0; render(); }',
              '      })',
              '    ]',
              '  });',
              '}',
              'render();'
            ].join('\n'),
            height: '360px'
          }),
          site.makeCallout('tip', 'This is the simplest pattern', {
            t: 'p', c: [
              'A closure variable and a render function is all you need for simple components. ',
              'You decide when to re-render by calling the function \u2014 every update is an ',
              'explicit call you can see and step through.'
            ]
          }),
          site.makeCallout('concept', 'This works, but there\'s a better way', {
            t: 'p', c: [
              'The closure pattern is great for simple cases. For anything with state you want to read or update from outside, use ',
              { t: 'code', c: 'o.state + o.render' },
              ' \u2014 shown in the next section.'
            ]
          })
        ]}
      ]
    };

    // =========================================================================
    // Section 4b: The Recommended Pattern — o.state + o.render
    // =========================================================================
    var section4b = {
      t: 'div', a: { class: 'bw_site_pages_demo', id: 'section-component' },
      c: [
        { t: 'h2', a: { class: 'bw_site_pages_demo_title' }, c: { t: 'a', a: { href: '#section-component' }, c: 'Stateful Components: o.state + o.render' } },
        { t: 'div', a: { class: 'bw_site_pages_demo_body' }, c: [
          { t: 'p', a: { class: 'bw_site_pages_demo_desc' }, c: [
            'When state belongs to one component, keep it on that component with ',
            { t: 'code', c: 'o.state + o.render' },
            '. State lives on the DOM element at ',
            { t: 'code', c: 'el._bw_state' },
            ', and ', { t: 'code', c: 'o.render(el)' },
            ' is called on mount and whenever you call ',
            { t: 'code', c: 'bw.refresh(el)' }, '.'
          ]},
          makeTryIt({
            code: [
              '// o.state + o.render = stateful component',
              'bw.DOM(target, {',
              '  t: \'div\',',
              '  o: {',
              '    state: { count: 0 },',
              '    render: function(el) {',
              '      var s = el._bw_state;',
              '      bw.DOM(el, {',
              '        t: \'div\', c: [',
              '          { t: \'h3\', c: \'Count: \' + s.count },',
              '          bw.makeButton({',
              '            text: \'+\', variant: \'primary\',',
              '            onclick: function() {',
              '              s.count++;',
              '              bw.refresh(el);',
              '            }',
              '          }),',
              '          \' \',',
              '          bw.makeButton({',
              '            text: \'Reset\',',
              '            variant: \'secondary\',',
              '            onclick: function() {',
              '              s.count = 0;',
              '              bw.refresh(el);',
              '            }',
              '          })',
              '        ]',
              '      });',
              '    }',
              '  }',
              '});'
            ].join('\n'),
            height: '420px'
          }),
          site.makeCallout('tip', 'When to use which pattern', {
            t: 'div', c: [
              { t: 'p', c: [
                { t: 'strong', c: 'Closure + render()' }, ' \u2014 simple widgets, one-off interactivity.'
              ]},
              { t: 'p', c: [
                { t: 'strong', c: 'o.state + o.render' }, ' \u2014 state that belongs to one component. State at el._bw_state, re-render via bw.refresh(el).'
              ]},
              { t: 'p', c: [
                { t: 'strong', c: 'Methods and patches' }, ' \u2014 the cheapest updates. Give a component methods with ',
                { t: 'code', c: 'o.handle' }, ' and call ', { t: 'code', c: 'el.bw.method()' },
                ', or change one element with ', { t: 'code', c: 'bw.patch()' },
                '. Nothing is rebuilt, so inputs keep focus and drags keep going.'
              ]},
              { t: 'p', a: { style: 'margin-top: 0.5rem;' }, c: [
                'See the ',
                { t: 'a', a: { href: '05-state.html' }, c: 'State & Interactivity' },
                ' page for the full comparison.'
              ]}
            ]
          })
        ]}
      ]
    };

    // =========================================================================
    // Section 5: Data-Driven UI
    // =========================================================================
    var section5 = {
      t: 'div', a: { class: 'bw_site_pages_demo', id: 'section-data-driven' },
      c: [
        { t: 'h2', a: { class: 'bw_site_pages_demo_title' }, c: { t: 'a', a: { href: '#section-data-driven' }, c: 'Data-Driven UI' } },
        { t: 'div', a: { class: 'bw_site_pages_demo_body' }, c: [
          { t: 'p', a: { class: 'bw_site_pages_demo_desc' }, c: [
            'In bitwrench, your data is the UI. As a result, template constructs such as ',
            { t: 'code', c: 'v-for' }, ' and ', { t: 'code', c: '{#each}' },
            ' are achieved with JavaScript\'s built-in ', { t: 'code', c: '.map()' }, ' function.'
          ]},
          makeTryIt({
            code: [
              'var fruits = [\'Apple\', \'Banana\', \'Cherry\', \'Date\', \'Elderberry\'];',
              '',
              'bw.DOM(target, {',
              '  t: \'ul\', a: { class: \'bw_list_group\' },',
              '  c: fruits.map(function(f) {',
              '    return {',
              '      t: \'li\',',
              '      a: { class: \'bw_list_group_item\' },',
              '      c: f',
              '    };',
              '  })',
              '});',
              '',
              '// Try: add more fruits, or change to .filter()',
              '// to show only fruits starting with a letter.'
            ].join('\n'),
            height: '260px'
          })
        ]}
      ]
    };

    // =========================================================================
    // Section 5b: Theming
    // =========================================================================
    var section5b = {
      t: 'div', a: { class: 'bw_site_pages_demo', id: 'section-theming' },
      c: [
        { t: 'h2', a: { class: 'bw_site_pages_demo_title' }, c: { t: 'a', a: { href: '#section-theming' }, c: 'Theming in One Call' } },
        { t: 'div', a: { class: 'bw_site_pages_demo_body' }, c: [
          { t: 'p', a: { class: 'bw_site_pages_demo_desc' }, c: [
            { t: 'code', c: 'bw.loadStyles()' },
            ' creates a complete design system from 2\u20133 seed colors. Every ',
            { t: 'code', c: 'bw_*' },
            ' component picks up the new palette automatically.'
          ]},
          makeTryIt({
            code: [
              '// Generate a theme from seed colors',
              'bw.loadStyles({',
              '  primary: \'#336699\',',
              '  secondary: \'#cc6633\',',
              '  tertiary: \'#2e8b57\'',
              '});',
              '',
              '// Output now uses the loaded theme',
              'bw.DOM(target, {',
              '  t: \'div\', c: [',
              '    bw.makeCard({',
              '      title: \'Themed Card\',',
              '      content: [',
              '        { t: \'p\', c: \'All colors derived \' +',
              '          \'from three seed hex values.\' },',
              '        bw.makeProgress({',
              '          value: 72,',
              '          variant: \'primary\',',
              '          label: \'72% done\' }),',
              '        { t: \'div\',',
              '          a: { style: \'margin-top:0.5rem;\' +',
              '            \' display:flex; gap:0.5rem;\' +',
              '            \' flex-wrap:wrap\' },',
              '          c: [',
              '            bw.makeButton({',
              '              text: \'Primary\',',
              '              variant: \'primary\',',
              '              size: \'sm\' }),',
              '            bw.makeButton({',
              '              text: \'Secondary\',',
              '              variant: \'secondary\',',
              '              size: \'sm\' }),',
              '            bw.makeButton({',
              '              text: \'Tertiary\',',
              '              variant: \'tertiary\',',
              '              size: \'sm\' })',
              '          ]}',
              '      ]',
              '    }),',
              '    bw.makeAlert({',
              '      content: \'Try changing the hex \' +',
              '        \'colors above and click Run!\',',
              '      variant: \'info\' })',
              '  ]',
              '});'
            ].join('\n'),
            height: '500px'
          }),
          site.makeCallout('concept', 'Built-in presets', {
            t: 'p', c: [
              'Try replacing the hex colors with a preset name: ',
              { t: 'code', c: "'ocean'" }, ', ',
              { t: 'code', c: "'sunset'" }, ', ',
              { t: 'code', c: "'forest'" }, ', ',
              { t: 'code', c: "'slate'" }, ', ',
              { t: 'code', c: "'midnight'" }, ', and more. ',
              'See the ',
              { t: 'a', a: { href: '10-themes.html' }, c: 'Themes' },
              ' page for the full generator.'
            ]
          })
        ]}
      ]
    };

    // =========================================================================
    // Section 6: Next Steps
    // =========================================================================
    var nextSteps = [
      { href: '03-styling.html', title: 'Styling',
        desc: 'Where bw_* classes come from, CSS generation from JavaScript objects, utility system.' },
      { href: '01-components.html', title: 'Components',
        desc: 'Cards, buttons, alerts, badges, grids \u2014 all built-in components with live demos.' },
      { href: '02-tables-forms.html', title: 'Tables & Forms',
        desc: 'Sortable tables, pagination, inputs, selects, checkboxes, validation patterns.' },
      { href: '05-state.html', title: 'State Management',
        desc: 'Component factories, state on elements, pub/sub for cross-component communication.' },
      { href: '06-tic-tac-toe-tutorial.html', title: 'Tic Tac Toe Tutorial',
        desc: 'Build a complete game step by step. The best hands-on way to learn bitwrench.' },
      { href: '07-framework-comparison.html', title: 'Framework Comparison',
        desc: 'The same tasks in HTML/JS, React, Vue, Svelte, and bitwrench side by side.' },
      { href: 'https://github.com/deftio/bitwrench/blob/main/docs/core-api.md', title: 'Core API Card',
        desc: 'One page, one line per call: mount, patch, syncChildren, css, pub/sub. For bringing your own design.' },
      { href: 'thinking-in-bitwrench.html', title: 'Thinking in Bitwrench',
        desc: 'The full design philosophy \u2014 TACO as component spec, composition patterns, and progressive enhancement.' }
    ];

    var section6 = {
      t: 'div', a: { class: 'bw_site_pages_demo', id: 'section-next-steps' },
      c: [
        { t: 'h2', a: { class: 'bw_site_pages_demo_title' }, c: { t: 'a', a: { href: '#section-next-steps' }, c: 'Next Steps' } },
        { t: 'div', a: { class: 'bw_site_pages_demo_body' }, c: [
          { t: 'div', a: { class: 'bw_feature_grid' },
            c: nextSteps.map(function(item) {
              return {
                t: 'div', a: { class: 'bw_site_pages_feature' },
                c: [
                  { t: 'h4', c: { t: 'a', a: { href: item.href, style: 'text-decoration: none;' }, c: item.title } },
                  { t: 'p', c: item.desc }
                ]
              };
            })
          }
        ]}
      ]
    };

    // =========================================================================
    // Assemble and mount the full page
    // =========================================================================
    var page = {
      t: 'div', c: [
        // Hero header
        {
          t: 'div', a: { class: 'bw_site_pages_header' },
          c: {
            t: 'div', a: { class: 'content-container wide', style: 'padding-top: 0; padding-bottom: 0;' },
            c: [
              { t: 'h1', c: 'Quick Start' },
              { t: 'p', a: { class: 'subtitle' }, c: 'From zero to a styled, interactive app in 5 minutes. Every example is editable.' }
            ]
          }
        },
        // Content sections
        {
          t: 'div', a: { class: 'content-container wide' },
          c: [
            { t: 'div', a: { class: 'bw_site_pages_callout bw_site_pages_callout_concept' }, c: [
                { t: 'h4', a: { class: 'bw_site_pages_callout_title' }, c: 'From Data to Components' },
