paragraph=Compose TACO UI nodes and bwserve protocol messages (mount, patch, append, remove, batch) as relaxed JSON strings for SSE push to browsers. The browser renders everything with bitwrench.js. Header-only, no dependencies, works on ESP32, RP2040, RP2350, STM32, AVR, and any board with a C compiler.
